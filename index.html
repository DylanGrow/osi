<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AI Quiz App - A beautifully designed, dynamic quiz application powered by AI. Test your tech knowledge.">
  <link rel="stylesheet" href="style.css">
  <title>AI Quiz App</title>
</head>

<body>
  <main id="game-container" class="container">

    <!-- Progress -->
    <div class="progress-container" aria-label="Game Progress">
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>

    <!-- QUIZ -->
    <section id="quiz-container" aria-labelledby="question">
      <!-- HUD -->
      <header id="hud" aria-label="Heads Up Display">
        <div id="score" class="hud-pill">Score: 0</div>
        <div id="timer" class="hud-pill">Time: 90s</div>
        <div id="streak" class="hud-pill">Streak: 0</div>
      </header>

      <h1 id="question">Loading question...</h1>

      <div id="options" role="group" aria-label="Answer Options"></div>

      <div id="feedback" aria-live="polite"></div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
